server {
    listen 80;
    server_name localhost;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /run to the ADK backend
    location /run {
        proxy_pass https://attention-triage-agent-967518492968.us-central1.run.app/run;
        proxy_set_header Host attention-triage-agent-967518492968.us-central1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /apps to the ADK backend (for session creation)
    location /apps {
        proxy_pass https://attention-triage-agent-967518492968.us-central1.run.app/apps;
        proxy_set_header Host attention-triage-agent-967518492968.us-central1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
